###############改名字##############
name: Redmi-AX6K-padavanonly241066

on:
  push:
    tags:
      - "*.*.*"
      # - "v*.*.*"
  repository_dispatch:
  #schedule:
  #  - cron: 30 22 * * *
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: padavanonly2410_66/Redmi-AX6000/feeds.conf.default
  CONFIG_FILE: padavanonly2410_66/Redmi-AX6000/BDG.config
  DIY_P1_SH: padavanonly2410_66/Redmi-AX6000/diy-BDG-part1.sh
  DIY_P2_SH: padavanonly2410_66/Redmi-AX6000/diy-BDG-part2.sh
  SSH_ACTIONS: false
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DTS_FILE: padavanonly2410_66/Redmi-AX6000/mt7986a-xiaomi-redmi-router-ax6000-mtkuboot.dts
  ###############改名字##############
  OPENWRT_NAME: padavanonly241066

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    # runs-on: ubuntu-latest

    steps:
    - name: 检查项目分支
      uses: actions/checkout@main   #https://github.com/actions/checkout

    - name: 检查硬盘空间
      if: (!cancelled())
      run: df -hT

    - name: 清理硬盘空间
      uses: mkorje/free-disk-space-action@v1

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libfuse-dev rename
        sudo -E apt-get -qq install gettext   #po2lmo
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /builder
        sudo chown $USER:$GROUPS /builder

    - name: 下载固件源码
      working-directory: /builder
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt || { echo 'Git clone failed!'; exit 1; }
        ln -sf /builder/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载feeds.conf.default
      run: |
        echo "===== DEBUG ====="
        echo "WORKSPACE=$GITHUB_WORKSPACE"
        pwd
        echo "===== FILE LIST ====="
        find $GITHUB_WORKSPACE -type f | sort
        [ -f "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default

    - name: 加载 DIY_P1_SH
      working-directory: /builder
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          echo "ERROR: File not found:"
          echo "$GITHUB_WORKSPACE/$DIY_P1_SH"
          exit 1
        fi
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

         # ========= 添加 hanwckf 110M / MTK U-Boot layout 大分区代码 =========
    - name: Apply AX6000 hanwckf 110M / MTK U-Boot Layout Modifications
      working-directory: /builder/openwrt
      run: |
        set -euo pipefail

        # 防 CRLF 自检
        if grep -q $'\r' "$0" 2>/dev/null; then
          echo "ERROR: script contains CRLF line endings" >&2; exit 1
        fi
        # 1. 在 filogic.mk 末尾追加 Device（红米AX6000 设备定义）
        cat << 'EOF' >> target/linux/mediatek/image/filogic.mk

        define Device/xiaomi_redmi-router-ax6000-mtkuboot
          DEVICE_VENDOR := Xiaomi
          DEVICE_MODEL := Redmi Router AX6000
          DEVICE_VARIANT := (MTK U-Boot layout)
          DEVICE_DTS := mt7986a-xiaomi-redmi-router-ax6000-mtkuboot
          DEVICE_DTS_DIR := ../dts
          IMAGE_SIZE := 112640k
          KERNEL_IN_UBI := 1
          IMAGES := factory.bin sysupgrade.bin
          IMAGE/factory.bin := append-ubi | check-size $$$$(IMAGE_SIZE)
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
        endef
        TARGET_DEVICES += xiaomi_redmi-router-ax6000-mtkuboot
        EOF

        echo "filogic.mk done"
        # 2. 创建全新的 hanwckf 110M / MTK U-Boot layout 大分区 DTS 设备树文件
        cat << 'EOF' > target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-mtkuboot.dts
        // SPDX-License-Identifier: (GPL-2.0 OR MIT)

        /dts-v1/;
        #include "mt7986a-xiaomi-redmi-router-ax6000.dtsi"

        / {
        	model = "Xiaomi Redmi Router AX6000 (MTK U-Boot layout)";
        	compatible = "xiaomi,redmi-router-ax6000-mtkuboot", "mediatek,mt7986a";
        };

        &spi_nand_flash {
        	mediatek,nmbm;
        	mediatek,bmt-max-ratio = <1>;
        	mediatek,bmt-max-reserved-blocks = <64>;
        };

        &partitions {
        	partition@580000 {
        		label = "crash";
        		reg = <0x580000 0x40000>;
        		read-only;
        	};

        	partition@5c0000 {
        		label = "crash_log";
        		reg = <0x5c0000 0x40000>;
        		read-only;
        	};

        	partition@600000 {
        		label = "ubi";
        		reg = <0x600000 0x6e00000>;
        	};
        };
        EOF
        echo "dts done"
        # 写入校验：失败立刻报错，不再静默通过
        grep -q 'xiaomi_redmi-router-ax6000-mtkuboot' target/linux/mediatek/image/filogic.mk
        test -s target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-mtkuboot.dts
        ls -l target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000.dtsi

        echo "✅ AX6000 hanwckf 110M / MTK U-Boot layout 大分区适配代码补丁应用成功！"

    - name: 更新 & 安装 feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: 恢复 Ccache 缓存
      uses: actions/cache@v6   #https://github.com/actions/cache
      with:
        path: |
          ~/.ccache
          /builder/openwrt/.ccache
        key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-
          ccache-${{ runner.os }}-

    - name: 加载config
      working-directory: /builder/openwrt
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          echo "ERROR: Config file not found:"
          echo "$GITHUB_WORKSPACE/$CONFIG_FILE"
          exit 1
        fi
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

    - name: 加载 DIY_P2_SH
      working-directory: /builder/openwrt
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
          echo "ERROR: File not found:"
          echo "$GITHUB_WORKSPACE/$DIY_P2_SH"
          exit 1
        fi
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: 下载安装包
      id: package
      working-directory: /builder/openwrt
      run: |
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      working-directory: /builder/openwrt
      run: |
        export CCACHE_DIR="/builder/openwrt/.ccache"
        ccache -M 10G
        ccache -s
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s || exit 1
        ccache -s
        echo "status=success" >> $GITHUB_OUTPUT

        # 1. 精准提取 DEVICE_NAME（取最后一个下划线后面的设备代号）
        grep '^CONFIG_TARGET_DEVICE.*_DEVICE_.*=y' .config | sed -E 's/.*_DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        # 2. 精准提取 TARGET_NAME（在 mediatek_ 架构下，通常子目标是 filogic）
        # 如果你的 subtarget 是 filogic，可以直接通过正则提取 target 和 subtarget 之间的名字
        grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -E 's/^CONFIG_TARGET_[^_]+_([^_]+)_DEVICE_.*/\1/' > TARGET_NAME
        [ -s TARGET_NAME ] && echo "TARGET_NAME=$(cat TARGET_NAME)" >> $GITHUB_ENV

        #CONFIG_LINE=$(grep '^CONFIG_TARGET_DEVICE_.*_DEVICE_.*=y' .config | head -n1)
        #DEVICE_NAME=$(echo "$CONFIG_LINE" | sed -E 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_(.*)=y$/\1/')
        #TARGET_NAME="filogic"
        #echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
        #echo "TARGET_NAME=$TARGET_NAME" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
        echo "DEVICE_NAME=$DEVICE_NAME"
        echo "TARGET_NAME=$TARGET_NAME"

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件并重命名
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      working-directory: /builder/openwrt
      run: |
        cd bin/targets/*/*
        rm -rf packages
        rename 's/.*${{ env.TARGET_NAME }}/${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}/' *
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到github
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}

    - name: 生成release标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "由衷感谢所有为openwrt无私奉献的大佬们" >> release.txt
        echo "The default IP address is 192.168.XXX.1" >> release.txt
        echo "## padavanonly-24.10 6.6 MTK Uboot layout" >> release.txt
        echo "------" >> release.txt
        useVersionInfo=$(git show -s --date=short --format="date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "$useVersionInfo" >> release.txt
        echo "📥 固件下载" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至release
      if: steps.tag.outputs.status == 'success' && !cancelled()
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old Releases
      uses: ui86/delete-older-releases@v1
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 8
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
