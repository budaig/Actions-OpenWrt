###############改名字##############
name: Redmi-AX6000-immortal2512_chasey

on:
  push:
    tags:
      - "*.*.*"
      # - "v*.*.*"
  repository_dispatch:
  #schedule:
  #  - cron: 30 22 * * *
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: immortal2512/Redmi-AX6000/feeds.conf.default
  CONFIG_FILE: immortal2512/Redmi-AX6000/BDG.config
  DIY_P1_SH: immortal2512/Redmi-AX6000/diy-BDG-part1.sh
  DIY_P2_SH: immortal2512/Redmi-AX6000/diy-BDG-part2.sh
  SSH_ACTIONS: false
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: immortal2512_chasey

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    # runs-on: ubuntu-latest

    steps:
    - name: 检查项目分支
      uses: actions/checkout@v7   #https://github.com/actions/checkout

    - name: 检查硬盘空间
      if: (!cancelled())
      run: df -hT

    - name: 清理硬盘空间
      uses: mkorje/free-disk-space-action@v1

    # - name: Free Disk Space (Ubuntu)
      # uses: thiagokokada/free-disk-space@main
      # with:
        # # this might remove tools that are actually needed, but is enabled by
        # # default
        # tool-cache: false
        # # possible dangerous options since they delete whole directories that
        # # are generally for third-party software or cache like /usr/local,
        # # /opt, /var/cache, only use them if you know what you're doing
        # usrmisc: true
        # usrlocal: true
        # opt: true
        # varcache: false
        # # this will run `du -h /* 2>/dev/null | sort -hr | head -n <N>` to show
        # # the top N directories by size, it is mostly used by development/debug
        # # and should not be used generally since it takes a while to calculate
        # debug: false

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        # 4 install dae
        # sudo apt-get install -y clang-15 llvm-15 npm
        # sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libfuse-dev rename
        sudo -E apt-get -qq install gettext   #po2lmo
        # sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        #install lib32gcc1
        # sudo -E apt-get -qq install libc6-i386 lib32stdc++6 lib32gcc1 lib32ncurses5
        # add libfuse
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /builder
        sudo chown $USER:$GROUPS /builder

    - name: 下载固件源码
      working-directory: /builder
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt || { echo 'Git clone failed!'; exit 1; }
        ln -sf /builder/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载 feeds.conf.default
      working-directory: /builder
      run: |
        set -e
        if [ ! -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then
          echo "feeds.conf.default not found:"
          echo "$GITHUB_WORKSPACE/$FEEDS_CONF"
          exit 1
        fi
        cp "$GITHUB_WORKSPACE/$FEEDS_CONF" \
          openwrt/feeds.conf.default

    - name: 加载 DIY_P1_SH
      working-directory: /builder
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          echo "ERROR: File not found:"
          echo "$GITHUB_WORKSPACE/$DIY_P1_SH"
          exit 1
        fi
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 更新 & 安装 feeds
      working-directory: /builder
      run: |
        cd openwrt
        ./scripts/feeds update -a
        # git clone -b master --single-branch https://github.com/immortalwrt/packages.git packages_master
        ./scripts/feeds install -a

    - name: 恢复 Ccache 缓存
      uses: actions/cache@v6   #https://github.com/actions/cache
      with:
        path: |
          ~/.ccache
          /builder/openwrt/.ccache
        key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-
          ccache-${{ runner.os }}-

    - name: 加载 DIY_P2_SH
      working-directory: /builder
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
          echo "ERROR: File not found:"
          echo "$GITHUB_WORKSPACE/$DIY_P2_SH"
          exit 1
        fi
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: 加载 config
      working-directory: /builder
      run: |
        set -euo pipefail
        echo "===== Check Config ====="
        if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          echo "ERROR: Config file not found"
          echo "$GITHUB_WORKSPACE/$CONFIG_FILE"
          exit 1
        fi
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config
        cd openwrt
        echo "===== Device Before Defconfig ====="
        grep "_DEVICE_" .config || true
        echo "===== AX6000 in Original Config ====="
        grep "AX6000" .config || true
        echo
        echo "===== Device lines before defconfig ====="
        grep "_DEVICE_" .config || true
        echo "===== Run Defconfig ====="
        make defconfig
        echo "===== Device After Defconfig ====="
        grep "^CONFIG_TARGET" .config | grep "=y" || true
        echo
        echo "===== Custom Device Check ====="
        grep -R "xiaomi_redmi-router-ax6000-110m" \
          target/linux/mediatek/image/ \
          target/linux/mediatek/dts/ \
          || true
        echo
        echo "===== Enabled Device ====="
        grep "_DEVICE_" .config | grep "=y" || true
        grep '^CONFIG_TARGET.*DEVICE_.*=y' .config | sed -r 's/^.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        grep '^CONFIG_TARGET.*DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_(DEVICE_)?[^_]+_([^_]+)_DEVICE_.*=y/\2/' > TARGET_NAME
        [ -s TARGET_NAME ] && echo "TARGET_NAME=$(cat TARGET_NAME)" >> $GITHUB_ENV
           #方法二
        # DEV_LINE=$(grep -E '^CONFIG_TARGET_(DEVICE_)?[^=]*_DEVICE_[^=]+=y$' .config | head -n1)
        # DEVICE_NAME=$(printf '%s\n' "$DEV_LINE" | sed -E 's/.*_DEVICE_(.*)=y$/\1/')
        # ARCH_NAME=$(printf '%s\n' "$DEV_LINE"   | sed -E 's/^CONFIG_TARGET_(DEVICE_)?([^_]+)_([^_]+)_DEVICE_.*/\2/')
        # TARGET_NAME=$(printf '%s\n' "$DEV_LINE" | sed -E 's/^CONFIG_TARGET_(DEVICE_)?([^_]+)_([^_]+)_DEVICE_.*/\3/')
        # [ -n "$DEVICE_NAME" ] || { echo "ERROR: DEVICE_NAME 提取失败" >&2; grep CONFIG_TARGET .config >&2; exit 1; }
        # [ -n "$TARGET_NAME" ] || { echo "ERROR: TARGET_NAME 提取失败" >&2; exit 1; }
        echo
        echo "===== Parsed Device ====="
        echo "$DEVICE_NAME"
        echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
        echo "TARGET=mediatek" >> "$GITHUB_ENV"
        echo "SUBTARGET=filogic" >> "$GITHUB_ENV"
        echo "FILE_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
        echo
        echo "===== Final Variables ====="
        echo "DEVICE_NAME=$DEVICE_NAME"
        echo "TARGET=mediatek"
        echo "SUBTARGET=filogic"

    - name: 下载安装包
      id: package
      working-directory: /builder
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 配置 ccache
      id: ccache_setup
      working-directory: /builder/openwrt
      run: |
        set -euo pipefail
        export CCACHE_DIR="/builder/openwrt/.ccache"
        mkdir -p "$CCACHE_DIR"
        echo "=== ccache 版本与配置 ==="
        ccache -V
        which ccache
        ccache --set-config=max_size=10G
        ccache --set-config=compiler_check=content
        # 交叉编译下减少无谓 miss
        ccache --set-config=sloppiness=file_macro,locale,time_macros
        ccache --set-config=base_dir=/builder/openwrt
        echo "=== 编译前统计（已清零） ==="
        ccache -z          # 清零，让后面的统计只反映本次构建
        ccache -s

    - name: 编译固件
      id: compile
      working-directory: /builder
      run: |
        set -euo pipefail
        cd openwrt
        echo "TARGET=$TARGET"
        echo "SUBTARGET=$SUBTARGET"
        echo "DEVICE_NAME=$DEVICE_NAME"
        export CCACHE_DIR="/builder/openwrt/.ccache"
        ccache -s || true
        echo "===== Start Compile ====="
        echo -e "$(nproc) thread compile"
        if ! make -j$(nproc) 2>&1 | tee build.log; then
          echo
          echo "========================================="
          echo " Parallel Build Failed"
          echo " Retry with make -j1 V=s"
          echo "========================================="
          echo
          echo "===== Error Summary ====="
          grep -inE \
          "error:|fatal:|undefined reference|No rule to make target|collect2:" \
          build.log | tail -50 || true
          echo
          echo "===== Last 500 Lines ====="
          tail -500 build.log || true
          echo
          echo "===== Retry Build ====="
          make -j1 V=s 2>&1 | tee build_retry.log
          exit 1
        fi
        echo
        echo "===== Build Success ====="
        ccache -s || true
        echo "status=success" >> "$GITHUB_OUTPUT"
        echo
        echo "===== Firmware Directory ====="
        ls -lh "bin/targets/${TARGET}/${SUBTARGET}" || true

         #同时兼容以下两种格式：CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y & CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y
         grep '^CONFIG_TARGET.*DEVICE_.*=y' .config | sed -r 's/^.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
         [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV

         grep '^CONFIG_TARGET.*DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_(DEVICE_)?[^_]+_([^_]+)_DEVICE_.*=y/\2/' > TARGET_NAME
         [ -s TARGET_NAME ] && echo "TARGET_NAME=$(cat TARGET_NAME)" >> $GITHUB_ENV

         #只兼容：CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-mtkuboot=y
         # DEVICE_NAME=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_.*_DEVICE_(.*)=y/\1/')
         # echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"

         # TARGET_NAME=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_[^_]+_([^_]+)_DEVICE_.*=y/\1/')
         # echo "TARGET_NAME=$TARGET_NAME" >> "$GITHUB_ENV"

         cat DEVICE_NAME
         cat TARGET_NAME

         echo $GITHUB_ENV
         echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
         echo "status=success" >> $GITHUB_OUTPUT

    - name: ccache 命中率报告
      if: ${{ always() }}
      working-directory: /builder/openwrt
      run: |
        set -euo pipefail
        export CCACHE_DIR="/builder/openwrt/.ccache"
        echo "=== 编译后 ccache 统计 ==="
        ccache -s
        echo "=== 缓存目录大小 ==="
        du -sh "$CCACHE_DIR" || true

    - name: 查看磁盘使用情况
      if: (!cancelled())
      run: df -hT

    - name: 整理文件并重命名
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      working-directory: /builder
      run: |
        set -euo pipefail
        cd openwrt/bin/targets/${TARGET}/${SUBTARGET}
        rm -rf packages
        rename 's/.*${{ env.TARGET_NAME }}/${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}/' *
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        echo $GITHUB_ENV
        echo $GITHUB_OUTPUT

    - name: 上传固件到 github
      uses: actions/upload-artifact@v7   #https://github.com/actions/upload-artifact
      # uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        path: ${{ env.FIRMWARE }}
        # path: /builder/openwrt/bin

    - name: 生成 release 标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        echo "release_tag=${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}" >> "$GITHUB_OUTPUT"
        touch release.txt
        echo "由衷感谢所有为openwrt无私奉献的大佬们" >> release.txt
        echo "The default IP address is 192.168.XXX.1" >> release.txt
        echo "## hanwckf 110M / MTK U-Boot layout" >> release.txt
        echo "------" >> release.txt
        useVersionInfo=$(git show -s --date=short --format="date: %cd<br/>commit: %s<br/>commit hash: %H")
        echo "$useVersionInfo" >> release.txt
        echo "📥 固件下载" >> release.txt
        echo "status=success"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 发布至 release
      if: steps.tag.outputs.status == 'success' && !cancelled()
      uses: softprops/action-gh-release@v3   #https://github.com/softprops/action-gh-release
      # workaround for https://github.com/softprops/action-gh-release/issues/628
      # uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

        # name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}
        # tag_name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ github.run_id }}
        # generate_release_notes: true
        # files: |
          # /builder/openwrt/bin/targets/mediatek/filogic/*.*
          # release.txt
          
        # /builder/openwrt/bin/targets/mediatek/filogic/*xiaomi_redmi-router-ax6000*-squashfs-sysupgrade.bin
        # /builder/openwrt/bin/targets/mediatek/filogic/*xiaomi_redmi-router-ax6000*-initramfs-kernel.bin

    - name: Remove old Releases
      # uses: dev-drprasad/delete-older-releases@master   #https://github.com/dev-drprasad/delete-older-releases
      uses: ui86/delete-older-releases@v1   #https://github.com/ui86/delete-older-releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 8
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # - name: Delete Artifacts
      # uses: geekyeggo/delete-artifact@v6   #https://github.com/GeekyEggo/delete-artifact
      # with:
        # name: ${{ env.FILE_DATE }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}
